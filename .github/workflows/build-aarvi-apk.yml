name: Build AARVI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "public/manifest.webmanifest"
      - ".github/workflows/build-aarvi-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@1.24.1

      - name: Configure Bubblewrap for CI
        run: |
          # Bubblewrap expects an Android command-line-tools layout with a
          # "tools" directory inside the configured SDK root. GitHub's
          # android-actions/setup-android keeps the tools under cmdline-tools.
          BW_SDK="$RUNNER_TEMP/bubblewrap-android-sdk"
          mkdir -p "$BW_SDK"
          ln -s "$ANDROID_HOME/cmdline-tools/latest" "$BW_SDK/tools"
          for dir in build-tools platform-tools platforms licenses; do
            if [ -d "$ANDROID_HOME/$dir" ]; then
              ln -s "$ANDROID_HOME/$dir" "$BW_SDK/$dir"
            fi
          done
          mkdir -p "$HOME/.bubblewrap"
          printf '%s\n' '{' '  "jdkPath": "'"$JAVA_HOME"'",' '  "androidSdkPath": "'"$BW_SDK"'"' '}' > "$HOME/.bubblewrap/config.json"
          echo "Bubblewrap config:"
          cat "$HOME/.bubblewrap/config.json"
          echo "SDK layout:"
          ls -la "$BW_SDK"
          ls -la "$BW_SDK/tools"
          bubblewrap doctor

      - name: Prepare TWA manifest
        run: |
          mkdir -p twa
          cat > twa/twa-manifest.json <<'EOF'
          {
            "packageId": "com.aarvi.messenger",
            "host": "rv.gamerlife659.workers.dev",
            "name": "AARVI",
            "launcherName": "AARVI",
            "display": "standalone",
            "orientation": "portrait-primary",
            "themeColor": "#0f172a",
            "backgroundColor": "#020617",
            "navigationColor": "#020617",
            "navigationColorDark": "#020617",
            "startUrl": "/",
            "iconUrl": "http://127.0.0.1:8765/icon-512.png",
            "maskableIconUrl": "http://127.0.0.1:8765/maskable-icon.png",
            "enableNotifications": true,
            "appVersionCode": 1,
            "appVersionName": "1.0.0",
            "minSdkVersion": 23,
            "signingKey": {
              "path": "android-keystore",
              "alias": "aarvi"
            },
            "shortcuts": [],
            "generatorApp": "bubblewrap",
            "webManifestUrl": "https://rv.gamerlife659.workers.dev/manifest.webmanifest",
            "fullScopeUrl": "https://rv.gamerlife659.workers.dev/",
            "additionalTrustedOrigins": [],
            "retainedBundles": [],
            "alphaDependencies": {
              "enabled": false
            },
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "splashScreenFadeOutDuration": 300,
            "fallbackType": "customtabs",
            "features": {}
          }
          EOF

      - name: Generate signing key
        working-directory: twa
        env:
          KEYSTORE_PASSWORD: aarvi-build-keystore
          KEY_PASSWORD: aarvi-build-key
        run: |
          keytool -genkeypair -v             -keystore android-keystore             -alias aarvi             -keyalg RSA             -keysize 2048             -validity 10000             -storepass "$KEYSTORE_PASSWORD"             -keypass "$KEY_PASSWORD"             -dname "CN=AARVI, OU=AARVI, O=AARVI, L=Jaipur, ST=Rajasthan, C=IN"

      - name: Generate Android TWA project
        run: |
          # Bubblewrap/Jimp is sensitive to remote image response headers/buffers.
          # Download the known-good PNG bytes first, then serve them locally with
          # Python's HTTP server so the response is explicitly image/png.
          curl -fsSL "https://raw.githubusercontent.com/bajajravi12/Bsjdj/main/public/icon-512.png" -o ./twa/icon-512.png
          curl -fsSL "https://raw.githubusercontent.com/bajajravi12/Bsjdj/main/public/maskable-icon.png" -o ./twa/maskable-icon.png
          python3 -m http.server 8765 --bind 127.0.0.1 --directory ./twa >/tmp/aarvi-icon-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          curl -fsSI "http://127.0.0.1:8765/icon-512.png"
          curl -fsSI "http://127.0.0.1:8765/maskable-icon.png"
          npx @bubblewrap/cli@1.24.1 update --manifest=./twa/twa-manifest.json --skipVersionUpgrade

      - name: Build signed APK
        working-directory: twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: aarvi-build-keystore
          BUBBLEWRAP_KEY_PASSWORD: aarvi-build-key
        run: |
          npx @bubblewrap/cli@1.24.1 build             --manifest=./twa-manifest.json             --signingKeyPath=./android-keystore             --signingKeyAlias=aarvi

      - name: Upload AARVI APK
        uses: actions/upload-artifact@v4
        with:
          name: AARVI-Android-APK
          path: twa/app-release-signed.apk
          if-no-files-found: error
