name: Build AARVI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "public/manifest.webmanifest"
      - ".github/workflows/build-aarvi-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Prepare TWA manifest
        run: |
          mkdir -p twa
          cat > twa/twa-manifest.json <<'EOF'
          {
            "packageId": "com.aarvi.messenger",
            "host": "gamerlife659.workers.dev",
            "name": "AARVI",
            "launcherName": "AARVI",
            "display": "standalone",
            "orientation": "portrait-primary",
            "themeColor": "#0f172a",
            "backgroundColor": "#020617",
            "navigationColor": "#020617",
            "navigationColorDark": "#020617",
            "startUrl": "/",
            "iconUrl": "https://gamerlife659.workers.dev/icon-512.png",
            "maskableIconUrl": "https://gamerlife659.workers.dev/maskable-icon.png",
            "enableNotifications": true,
            "appVersionCode": 1,
            "appVersionName": "1.0.0",
            "minSdkVersion": 23,
            "signingKey": {
              "path": "android-keystore",
              "alias": "aarvi"
            },
            "shortcuts": [],
            "generatorApp": "bubblewrap",
            "webManifestUrl": "https://gamerlife659.workers.dev/manifest.webmanifest",
            "fullScopeUrl": "https://gamerlife659.workers.dev/",
            "additionalTrustedOrigins": [],
            "retainedBundles": [],
            "alphaDependencies": {
              "enabled": false
            },
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "splashScreenFadeOutDuration": 300,
            "fallbackType": "customtabs",
            "features": {}
          }
          EOF

      - name: Generate signing key
        working-directory: twa
        env:
          KEYSTORE_PASSWORD: aarvi-build-keystore
          KEY_PASSWORD: aarvi-build-key
        run: |
          keytool -genkeypair -v             -keystore android-keystore             -alias aarvi             -keyalg RSA             -keysize 2048             -validity 10000             -storepass "$KEYSTORE_PASSWORD"             -keypass "$KEY_PASSWORD"             -dname "CN=AARVI, OU=AARVI, O=AARVI, L=Jaipur, ST=Rajasthan, C=IN"

      - name: Generate Android TWA project
        run: |
          npx @bubblewrap/cli update             --manifest=./twa/twa-manifest.json             --skipVersionUpgrade

      - name: Build signed APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: aarvi-build-keystore
          BUBBLEWRAP_KEY_PASSWORD: aarvi-build-key
        run: |
          cd twa
          npx @bubblewrap/cli build             --manifest=./twa-manifest.json             --signingKeyPath=./android-keystore             --signingKeyAlias=aarvi

      - name: Upload AARVI APK
        uses: actions/upload-artifact@v4
        with:
          name: AARVI-Android-APK
          path: twa/app-release-signed.apk
          if-no-files-found: error
